---
# ==============================================================================
# journald role defaults.
#
# These are a MIRROR of group_vars/all/main.yml, which outranks them. They exist
# only so the role still works if it is run standalone, outside this repo's
# inventory — the same convention every other role here follows.
#
# The reasoning behind each value, and the list of directives deliberately NOT
# set (SystemMaxUse and MaxRetentionSec are jmdn's; SystemKeepFree cannot take a
# percentage), lives in group_vars/all/main.yml. Read it there rather than
# duplicating it here.
#
# ForwardToSyslog was briefly in that list. It is now set to "no" — that single
# directive is what keeps /var/log/syslog from filling the disk. See D-18.
#
# tests/doc_claims.py asserts these literals match group_vars, and that
# journald_directives matches what the template actually writes, so neither the
# mirror nor the assertion contract can drift unnoticed.
# ==============================================================================

journald_dropin_name: "zz-jmdn-validator.conf"
journald_dropin_legacy_names:
  - "10-jmdn-validator.conf"      # this role, before it was renamed to sort last
  - "zz-jmdn-no-syslog.conf"      # emergency-disk-reclaim.sh, so the emergency
                                  # path converges on the managed drop-in
journald_logrotate_maxsize: "200M"

journald_max_file_size: "100M"

# --- Reclaim on already-broken machines ----------------------------------------
# The two settings above stop the growth. They do not free what a node has already
# accumulated: one real node was carrying /var/log/syslog at 31 GB and syslog.1 at
# 22 GB when the fix arrived. A playbook that fixes fresh installs but leaves a
# full disk full is half a fix, so the role reclaims too.
#
# Safe by construction: only files directly in /var/log, only the names below,
# only above the same threshold logrotate now enforces. Nothing under /opt is ever
# touched. On a fresh install nothing matches and the tasks are no-ops, which is
# also what makes it idempotent.
journald_reclaim_oversized_logs: true

# Same value as the logrotate cap on purpose: anything larger than the limit we
# now enforce is by definition legacy bloat from the unbounded era.
journald_reclaim_threshold: "200M"

# Active files are TRUNCATED, never deleted — rsyslog holds them open, so a delete
# frees nothing until rsyslog restarts while the blocks stay allocated to a file
# you can no longer see. Their rotated copies (.1, .2.gz) are closed, so those are
# deleted outright.
journald_reclaim_active_names:
  - syslog
  - messages
  - auth.log
  - kern.log
  - daemon.log
  - user.log
  - debug

# The journal is deliberately NOT vacuumed. With ForwardToSyslog=no it is the only
# remaining copy of these logs, and jmdn's jmdn-limits.conf already caps it at 5G
# with 30-day retention. Vacuuming would destroy the record to reclaim space that
# was never the problem — on the affected node the journal was 180 MB against
# 53 GB of syslog.

journald_rate_limit_interval: "30s"
journald_rate_limit_burst: 100000
journald_runtime_max_use: "100M"

# Asserted after the restart, and again by verify.yml: each of these must be the
# EFFECTIVE value once systemd has merged every journald.conf.d drop-in.
journald_directives:
  Storage: "persistent"
  SystemMaxFileSize: "{{ journald_max_file_size }}"
  RuntimeMaxUse: "{{ journald_runtime_max_use }}"
  RateLimitIntervalSec: "{{ journald_rate_limit_interval }}"
  RateLimitBurst: "{{ journald_rate_limit_burst | string }}"
  ForwardToWall: "no"
  ForwardToSyslog: "no"
