---
# ==============================================================================
# Cross-role contract. Operators do not edit this file — edit operator.yml.
#
# group_vars outrank role defaults, so anything shared between roles (or read by
# verify.yml, which runs none of the install roles) is defined HERE using the
# exact variable name each role consumes. Each role keeps an identical literal
# in its defaults so it also works standalone.
#
# Getting this wrong is silent: a value set under a name no role reads simply
# has no effect. That happened during review with jmdn_textfile_dir.
# ==============================================================================

# --- Shared path: written by the health collector, read by node_exporter ------
jmdn_textfile_dir: /var/lib/node_exporter/textfile
node_exporter_textfile_dir: "{{ jmdn_textfile_dir }}"
jmdn_health_textfile_dir: "{{ jmdn_textfile_dir }}"

# --- Shared endpoints: also read by verify.yml, which runs no install role ----
node_exporter_listen_address: "127.0.0.1:9100"
otel_agent_self_metrics_address: "127.0.0.1:8888"
node_exporter_group: "node_exporter"

# --- Collector cadence: verify.yml derives its staleness tolerance from this --
# Defined here so changing it cannot leave verify.yml checking against a stale
# hardcoded 30s.
jmdn_health_interval_seconds: 30

# --- Service account shell ----------------------------------------------------
# Debian/Ubuntu ship /usr/sbin/nologin; RHEL/Amazon Linux ship /sbin/nologin.
# A missing path makes the `user` module fail outright.
jmdn_nologin_shell: >-
  {{ '/usr/sbin/nologin' if ansible_facts['os_family'] | default('Debian') == 'Debian'
     else '/sbin/nologin' }}

# --- Identity stamped onto every metric datapoint -----------------------------
#
# WHY datapoint attributes and not OTLP resource attributes: on the hub, OTLP
# resource attributes become labels on a separate `target_info` series — only
# job/instance are promoted onto the metrics themselves. Identity carried only
# in the resource would produce series with no `server` label, and every
# existing dashboard panel filters on `server`.
# jmdn's config. Read by TWO roles — identity (for node.alias) and verify (for
# ports, binds and the drift check) — so it lives here rather than in either
# role's defaults. Overridable for testing: pointing both roles at a fixture is
# how the resolution and drift logic get exercised without touching a live node.
jmdn_config_path: /etc/jmdn/jmdn.yaml

# journald drop-in filename. Read by TWO roles — journald (writes it) and verify
# (asserts it is still in the effective config) — so it lives here rather than in
# journald's defaults, where verify would have to duplicate it as a default() and
# the two could drift apart.
#
#   "10-"  systemd applies drop-ins in lexical order across every
#          journald.conf.d directory, last winning per key. Nothing ships a
#          competing drop-in on Debian/Ubuntu (/usr/lib, /etc and /run
#          journald.conf.d are all absent by default), so 10 is early enough that
#          an operator who disagrees with a value can add 20-mine.conf beside it
#          and win, without editing our file.
#
#   name   identifies the OWNER, not the contents. journald.conf.d is
#          machine-global, so someone finding a setting here needs to know who
#          put it there. Contrast the ImmuDB drop-in, which sits inside
#          immudb.service.d/ where ownership is implicit and so is named for its
#          effect (10-loopback-only.conf).
journald_dropin_name: "10-jmdn-validator.conf"

# Resolved by roles/identity, which honours node_id: "auto" by reading node.alias
# out of jmdn_config_path. The fallback keeps playbooks that run no roles
# (tests/scope_check.yml) evaluable; set_fact in the role outranks it.
jmdn_node_id: "{{ node_id }}"

jmdn_identity:
  server: "{{ jmdn_node_id }}"
  operator_id: "{{ operator_id }}"
  node_role: "{{ node_role | default('validator') }}"
  chain_id: "{{ (network_profile.chain_id | default(0)) | string }}"

# --- Prometheus job names -----------------------------------------------------
# Stable on purpose: Jupiter Meta dashboards template on label_values(up, job),
# so renaming these orphans the node in our views.
jmdn_job_host: jmdn-operator-host
jmdn_job_app: jmdn-operator-app
