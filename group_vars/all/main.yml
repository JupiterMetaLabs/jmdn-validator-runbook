---
# ==============================================================================
# Cross-role contract. Operators do not edit this file — edit operator.yml.
#
# group_vars outrank role defaults, so anything shared between roles (or read by
# verify.yml, which runs none of the install roles) is defined HERE using the
# exact variable name each role consumes. Each role keeps an identical literal
# in its defaults so it also works standalone.
#
# Getting this wrong is silent: a value set under a name no role reads simply
# has no effect. That happened during review with jmdn_textfile_dir.
# ==============================================================================

# --- Shared path: written by the health collector, read by node_exporter ------
jmdn_textfile_dir: /var/lib/node_exporter/textfile
node_exporter_textfile_dir: "{{ jmdn_textfile_dir }}"
jmdn_health_textfile_dir: "{{ jmdn_textfile_dir }}"

# --- Shared endpoints: also read by verify.yml, which runs no install role ----
node_exporter_listen_address: "127.0.0.1:9100"
otel_agent_self_metrics_address: "127.0.0.1:8888"
node_exporter_group: "node_exporter"

# --- Collector cadence: verify.yml derives its staleness tolerance from this --
# Defined here so changing it cannot leave verify.yml checking against a stale
# hardcoded 30s.
jmdn_health_interval_seconds: 30

# --- Service account shell ----------------------------------------------------
# Debian/Ubuntu ship /usr/sbin/nologin; RHEL/Amazon Linux ship /sbin/nologin.
# A missing path makes the `user` module fail outright.
jmdn_nologin_shell: >-
  {{ '/usr/sbin/nologin' if ansible_facts['os_family'] | default('Debian') == 'Debian'
     else '/sbin/nologin' }}

# --- Identity stamped onto every metric datapoint -----------------------------
#
# WHY datapoint attributes and not OTLP resource attributes: on the hub, OTLP
# resource attributes become labels on a separate `target_info` series — only
# job/instance are promoted onto the metrics themselves. Identity carried only
# in the resource would produce series with no `server` label, and every
# existing dashboard panel filters on `server`.
# jmdn's config. Read by TWO roles — identity (for node.alias) and verify (for
# ports, binds and the drift check) — so it lives here rather than in either
# role's defaults. Overridable for testing: pointing both roles at a fixture is
# how the resolution and drift logic get exercised without touching a live node.
jmdn_config_path: /etc/jmdn/jmdn.yaml

# --- journald ------------------------------------------------------------------
# Everything journald lives here, not in roles/journald/defaults, because BOTH
# the journald role (which writes the drop-in) and verify.yml (which re-asserts
# it, running no install role) need the same values. A role default would force
# verify to restate them behind default() and the two would drift.
#
# Drop-in filename. systemd merges every journald.conf.d drop-in in lexicographic
# FILENAME order and the last assignment of a key wins.
#
#   "zz-"  must sort LAST, because two other files set keys we need to control:
#          jmdn's Scripts/install_services.sh:83 writes jmdn-limits.conf, and the
#          distro sets ForwardToSyslog=yes. Letters sort after digits in ASCII, so
#          a numeric prefix — 10-, 50-, even 99- — loses to both. This was measured:
#          SystemMaxUse=2G in a 10- prefixed file was silently overridden by jmdn's
#          5G, and the presence-only assertion of the day passed anyway.
#
#          Cost of sorting last: an operator who wants to override a value must
#          edit this file rather than drop one beside it. Accepted — losing
#          ForwardToSyslog is what filled a 96 GB disk.
#
#   name   identifies the OWNER, not the contents. journald.conf.d is
#          machine-global, so someone finding a setting here needs to know who put
#          it there. Contrast the ImmuDB drop-in, which sits inside
#          immudb.service.d/ where ownership is implicit and so is named for its
#          effect (10-loopback-only.conf).
journald_dropin_name: "zz-jmdn-validator.conf"

# Drop-ins this role shipped under earlier names. Removed on every run so an
# upgraded node does not end up with two of ours fighting over the same keys.
journald_dropin_legacy_names:
  - "10-jmdn-validator.conf"      # this role, before it was renamed to sort last
  - "zz-jmdn-no-syslog.conf"      # emergency-disk-reclaim.sh, so the emergency
                                  # path converges on the managed drop-in

# Second, independent layer. journald forwarding is off above, so /var/log/syslog
# should stay near-empty — but if anything re-enables it, or a process writes to
# syslog directly, this bounds the damage. A GLOBAL maxsize in logrotate.conf
# forces early rotation of any stanza that only declares a time interval; the
# distro's rsyslog stanza declares "weekly" with no size cap, which is how one
# file reached 31 GB. Verified: a second stanza for the same path is NOT an
# option — logrotate reports "duplicate log entry" and skips the whole file.
journald_logrotate_maxsize: "200M"

# Rotate individual journal files at this size — quick to search, and vacuuming
# reclaims space in reasonable increments. jmdn does not set it.
journald_max_file_size: "100M"
# --- Reclaim on already-broken machines ----------------------------------------
# The two settings above stop the growth. They do not free what a node has already
# accumulated: one real node was carrying /var/log/syslog at 31 GB and syslog.1 at
# 22 GB when the fix arrived. A playbook that fixes fresh installs but leaves a
# full disk full is half a fix, so the role reclaims too.
#
# Safe by construction: only files directly in /var/log, only the names below,
# only above the same threshold logrotate now enforces. Nothing under /opt is ever
# touched. On a fresh install nothing matches and the tasks are no-ops, which is
# also what makes it idempotent.
journald_reclaim_oversized_logs: true

# Same value as the logrotate cap on purpose: anything larger than the limit we
# now enforce is by definition legacy bloat from the unbounded era.
journald_reclaim_threshold: "200M"

# Active files are TRUNCATED, never deleted — rsyslog holds them open, so a delete
# frees nothing until rsyslog restarts while the blocks stay allocated to a file
# you can no longer see. Their rotated copies (.1, .2.gz) are closed, so those are
# deleted outright.
journald_reclaim_active_names:
  - syslog
  - messages
  - auth.log
  - kern.log
  - daemon.log
  - user.log
  - debug

# The journal is deliberately NOT vacuumed. With ForwardToSyslog=no it is the only
# remaining copy of these logs, and jmdn's jmdn-limits.conf already caps it at 5G
# with 30-day retention. Vacuuming would destroy the record to reclaim space that
# was never the problem — on the affected node the journal was 180 MB against
# 53 GB of syslog.


# THE DIRECTIVE THAT ACTUALLY MATTERS.
# journald DISCARDS messages beyond RateLimitBurst per RateLimitIntervalSec per
# service, recording only "Suppressed N messages". The default is 10000/30s =
# 333/sec. A validator at idle was measured at ~2,200 lines/hour from jmdn alone
# (~18 per 30s), so the default looks generous — but the moment that matters is a
# block-processing burst, and losing NEW logs during an incident is worse than
# losing old ones.
#
# 100000/30s ≈ 3,300/sec: ~180x measured idle. Deliberately finite rather than 0
# (unlimited) so a pathological log loop still cannot saturate disk I/O.
# Nothing else on a JMDN node sets these.
journald_rate_limit_interval: "30s"
journald_rate_limit_burst: 100000

# Volatile (RAM) journal cap. Default is 10% of RAM — 800 MB on the 8 GB machine
# this runbook specifies, which is a lot to lose to logs if /var/log/journal is
# ever unavailable. jmdn does not set it.
journald_runtime_max_use: "100M"

# The contract asserted after the restart, and again by verify.yml: every one of
# these must be the EFFECTIVE value once all drop-ins are merged. tests/ checks
# this map against the rendered template, so a directive cannot be added to one
# without the other.
#
# Deliberately absent, and why:
#   SystemMaxUse, MaxRetentionSec  jmdn-limits.conf owns them and wins on
#                                  filename order (5G / 30d by default).
#   SystemKeepFree                 journald's parser REJECTS a percentage:
#                                  "Failed to parse SystemKeepFree=15%, ignoring:
#                                  Invalid argument" (Ubuntu 26.04). Its built-in
#                                  default already scales with the filesystem, so
#                                  not setting it beats hard-coding a size.
#   Compress, SyncIntervalSec      already the defaults; restating one creates a
#                                  value that can drift out of sync with systemd.
journald_directives:
  Storage: "persistent"
  SystemMaxFileSize: "{{ journald_max_file_size }}"
  RuntimeMaxUse: "{{ journald_runtime_max_use }}"
  RateLimitIntervalSec: "{{ journald_rate_limit_interval }}"
  RateLimitBurst: "{{ journald_rate_limit_burst | string }}"
  ForwardToWall: "no"
  # The one that keeps the disk from filling. /var/log/syslog is rotated weekly
  # with no size cap, so a chatty process fills the disk inside one window.
  ForwardToSyslog: "no"

# Resolved by roles/identity, which honours node_id: "auto" by reading node.alias
# out of jmdn_config_path. The fallback keeps playbooks that run no roles
# (tests/scope_check.yml) evaluable; set_fact in the role outranks it.
jmdn_node_id: "{{ node_id }}"

jmdn_identity:
  server: "{{ jmdn_node_id }}"
  operator_id: "{{ operator_id }}"
  node_role: "{{ node_role | default('validator') }}"
  chain_id: "{{ (network_profile.chain_id | default(0)) | string }}"

# --- Prometheus job names -----------------------------------------------------
# Stable on purpose: Jupiter Meta dashboards template on label_values(up, job),
# so renaming these orphans the node in our views.
jmdn_job_host: jmdn-operator-host
jmdn_job_app: jmdn-operator-app
