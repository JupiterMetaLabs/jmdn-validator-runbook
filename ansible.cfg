# jmdn-validator-runbook — Ansible configuration
#
# This kit runs against one machine: the one you are on. There is no fleet
# inventory, no vault, and no privilege escalation beyond sudo.
#
#   host_key_checking = True   left ON deliberately. This kit may be run over
#                              untrusted networks, where disabling it would
#                              silently accept a substituted host.
[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
interpreter_python   = auto_silent
# YAML-formatted task results without needing community.general's callback.
# Requires ansible-core >= 2.13.
result_format        = yaml
display_skipped_hosts = False
forks                = 5

[privilege_escalation]
become        = True
become_method = sudo
