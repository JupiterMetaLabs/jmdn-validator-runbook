# JMDN Validator Node Configuration — bare metal
# ─────────────────────────────────────────────────────────────────────────────
# For: external operators running a JMDN validator on a dedicated machine.
#
# Usage:
#   sudo mkdir -p /etc/jmdn
#   sudo cp jmdn_validator.yaml /etc/jmdn/jmdn.yaml
#   sudo ${EDITOR:-nano} /etc/jmdn/jmdn.yaml   # fill in every REQUIRED field
#
# Derived from jmdn_exchange.yaml (the current, maintained template) with three
# classes of change for a bare-metal validator:
#   1. Bare-metal addresses, not Docker DNS names (localhost, not "immudb").
#   2. Network policy: only JSON-RPC and WebSocket face the internet.
#   3. Database credentials omitted rather than blanked — see section 5.
#
# NETWORK POLICY — the whole point of this file
#   Public:   15000 (TCP+UDP, P2P), 15001 (Yggdrasil), 8545 (RPC), 8546 (WS)
#   Internal: Explorer API and metrics, bound to 127.0.0.1
#   Disabled: DID, admin CLI, block generation, block gRPC, profiler
#
# Secrets: never commit this file once filled in. Prefer environment overrides
#          in production (JMDN_ prefix), e.g. JMDN_SECURITY_JWT_SECRET=<value>.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Node identity ─────────────────────────────────────────────────────────
node:
  # REQUIRED — THIS is your node's name, and the single place you set it.
  #
  # It is what the seednode registers you under and what appears in jmdn's logs.
  # The runbook derives its `server` metric label from it automatically
  # (operator.yml ships node_id: "auto"), so there is nothing to keep in sync.
  #
  # Unique across every node you run. Lowercase [a-z0-9-], 2-63 characters.
  alias: "<YOUR_NODE_ALIAS>"           # e.g. "acme-validator-1"

# ── 2. Network ───────────────────────────────────────────────────────────────
network:
  chain_id: 7000700                    # JMDT mainnet — do not change.
  # REQUIRED — both supplied by Jupiter Meta when you are onboarded. They are
  # not published; use exactly the values you were given, including the port.
  seednode: "<SEEDNODE_HOST:PORT>"
  mempool: "<MEMPOOL_HOST:PORT>"
  yggdrasil: true
  heartbeat_interval: 10               # seconds

# ── 3. Ports ─────────────────────────────────────────────────────────────────
# 0 disables the listener entirely. Enabling anything currently at 0 is very
# unlikely to be correct on a validator — ask Jupiter Meta first.
ports:
  facade: 8545     # Ethereum JSON-RPC        — PUBLIC
  ws: 8546         # WebSocket RPC            — PUBLIC
  did: 0           # DID service              — DISABLED. Not used by a validator.
  api: 8090        # Explorer HTTP API        — internal. Set 0 if you do not
                   #   want it; the runbook's health checks then report less
                   #   detail but still work. Requires the secrets in §9.
  metrics: 8081    # Prometheus metrics       — internal. Leave enabled: the
                   #   runbook's telemetry agent scrapes this on loopback.
  cli: 0           # Admin CLI                — DISABLED. Full node control.
  blockgen: 0      # Block generation         — DISABLED. Sequencer only.
  blockgrpc: 0     # Block propagation gRPC   — DISABLED. Sequencer only.
  profiler: 0      # pprof                    — DISABLED. Debugging only.

# ── 4. Binds ─────────────────────────────────────────────────────────────────
# Every key is listed explicitly, even where the value matches the default.
# The values compiled into jmdn and those in the shipped YAML templates do not
# agree for every key (binds.api defaults to 0.0.0.0 in the binary and
# 127.0.0.1 in jmdn_default.yaml), so omitting a key can silently expose a
# listener. Listing all of them removes that trap.
binds:
  facade: "0.0.0.0"      # PUBLIC JSON-RPC. Bind 127.0.0.1 if you do not serve
                         #   public RPC — see the runbook, Stage 0.2.
  ws: "0.0.0.0"          # PUBLIC WebSocket. Same.
  did: "127.0.0.1"       # loopback, and disabled above. Upstream ships 0.0.0.0 —
                         #   do not copy that if you ever enable it.
  api: "127.0.0.1"       # internal. Never expose: it fronts chain and DB state.
  metrics: "127.0.0.1"   # internal. Scraped by the local telemetry agent.
  cli: "127.0.0.1"       # internal, and disabled above. Reach it via SSH tunnel.
  blockgen: "127.0.0.1"  # internal, and disabled above.
  blockgrpc: "127.0.0.1" # internal, and disabled above.
  profiler: "127.0.0.1"  # internal, and disabled above. STRICTLY localhost.

# ── 5. Database ──────────────────────────────────────────────────────────────
# Bare metal: ImmuDB and Redis run on this machine.
#
# username/password are DELIBERATELY OMITTED. jmdn compiles in
# username "immudb" / password "immudb", which is what a local ImmuDB install
# uses. Writing `password: ""` here would OVERRIDE that default with an empty
# string and break authentication — the Docker templates carry that line
# because Compose supplies the real value through the environment instead.
#
# To use different credentials, prefer the environment:
#   JMDN_DATABASE_USERNAME=<value>
#   JMDN_DATABASE_PASSWORD=<value>
database:
  address: "localhost"
  port: 3322

  redis:
    url: "127.0.0.1:6379"
    # password also omitted on purpose. setup_dependencies.sh generates a random
    # Redis password into /etc/jmdn/redis.env and the service wrapper exports it
    # as JMDN_DATABASE_REDIS_PASSWORD, which outranks this file. Do not set it
    # here — you would be guessing at a value the installer already chose.

# ── 6. Logging ───────────────────────────────────────────────────────────────
logging:
  level: "info"                        # debug | info | warn | error
  development: false
  # REQUIRED — copy node.alias from section 1 exactly.
  #
  # This becomes service.name on forwarded logs and traces, and the hub keys
  # Grafana log/trace correlation on it. Left at jmdn's default it is the constant
  # "jmdn", which merges every operator's logs into one stream.
  #
  # The only field you must duplicate. A future jmdn release will default it to
  # node.alias; until then Stage 3 warns if the two disagree.
  service_name: "<YOUR_NODE_ALIAS>"

  console:
    enabled: true
    format: "systemd"                  # json | pretty | systemd
    color: true
    errors_to_stderr: true

  file:
    enabled: false
    path: ""
    max_size_mb: 100
    max_age_days: 7
    max_backups: 5
    compress: true

  # Forward this node's own logs and traces to the local telemetry agent the
  # runbook installs in Stage 2.
  #
  # Enabled by default, and safe to have on BEFORE the agent exists: the OTLP
  # exporter does not dial at startup, so a closed 127.0.0.1:4317 costs some
  # retries in the background and nothing else. Verified — a node ran from Stage
  # 1.9 through a HEALTHY Stage 3 with this true and no agent listening until
  # Stage 2.
  #
  # insecure: true is correct here and only here: the traffic never leaves the
  # loopback interface. The agent adds identity, a disk buffer, and TLS on the
  # single outbound connection.
  otel:
    enabled: true
    endpoint: "127.0.0.1:4317"
    protocol: "grpc"
    insecure: true
    headers: {}
    batch_size: 512
    export_interval: "5s"

  tracing:
    enabled: false
    sampler: "ratio:0.2"

# ── 7. Features ──────────────────────────────────────────────────────────────
features:
  use_legacy_bft: false
  grotrack: false

# ── 8. FastSync ──────────────────────────────────────────────────────────────
fastsync:
  enabled: true
  enable_pulling: true                 # this node pulls state from peers
  # enable_catchup MUST stay true. It is what wires this node's committee
  # eligibility source; with it false the node accepts no block certificates
  # and makes no progress while still looking healthy.
  enable_catchup: true
  sync_timeout: "100m"                 # long syncs are expected from a cold snapshot
  sync_check_interval: "10m"

  # REQUIRED if you bootstrapped ImmuDB from a chain snapshot.
  #
  # Set to the snapshot's tip block + 1. Jupiter Meta provides the exact value
  # alongside the snapshot download — it cannot be guessed, and a value from an
  # older snapshot makes this node SKIP BLOCKS SILENTLY.
  #
  # 13450 matches the snapshot bootstrap_sync.sh downloads by default:
  # gs://jmdn-bootstrap/bootstrap-26072026, whose chain tip is 13449.
  #
  # VERIFY THIS AGAINST YOUR CHECKOUT before starting the node:
  #   grep -E 'GCS_PREFIX=|chain tip' /opt/jmdn-src/Scripts/bootstrap_sync.sh
  # If that shows a different prefix or tip, use tip+1 instead. A value from an
  # OLDER snapshot than the one you downloaded makes this node SKIP BLOCKS
  # SILENTLY — no error appears anywhere.
  #
  # Set 0 only if you skipped the snapshot entirely; that forces a full scan
  # from genesis, which is safe but very slow.
  catch_up_from_block: 13450

# ── 9. Consensus ─────────────────────────────────────────────────────────────
# Nothing to configure. This node takes the committee authority key from the
# seednode on first contact and pins it to /opt/jmdn/config/seedAuth.json; every
# later snapshot must match that key.

# ── 10. Security ─────────────────────────────────────────────────────────────
security:
  enabled: true
  ip_cache_size: 1000

  # REQUIRED only if ports.api is non-zero. Generate both:
  #   openssl rand -hex 32
  # Prefer the environment in production:
  #   JMDN_SECURITY_EXPLORER_API_KEY / JMDN_SECURITY_JWT_SECRET
  # These protect YOUR node's Explorer API. They are never shared with anyone,
  # and the runbook never transmits them.
  explorer_api_key: ""
  jwt_secret: ""

  # Layer 1: aggregate per-IP cap across all services.
  global_rate_limit: 150
  global_burst: 300

  # Only enable if a load balancer or CDN fronts this node, and list its IPs in
  # trusted_proxies. Trusting forwarded headers with an empty proxy list lets a
  # caller spoof its source IP and bypass per-IP rate limiting.
  trust_forwarded_headers: false
  trusted_proxies: []

  # IPs/CIDRs exempt from rate limiting. Not an auth bypass.
  trusted_clients: []

  services:
    # Ethereum JSON-RPC — the only public, unauthenticated surface. These limits
    # are what stand between a public endpoint and your consensus CPU budget.
    eth_rpc:
      rate_limit: 50
      burst: 100

    # DID service — internal, but limited anyway.
    did_service:
      rate_limit: 30
      burst: 60

    # Explorer HTTP API — Bearer token, using explorer_api_key above.
    #   Authorization: Bearer <explorer_api_key>
    explorer_api:
      rate_limit: 50
      burst: 100
      auth_type: "token"
      token_env: "EXPLORER_API_KEY"

    mempool_service:
      tls: false

# ── 11. Alerts (optional) ────────────────────────────────────────────────────
# Your own alert webhook, independent of the runbook's telemetry.
# alerts:
#   url: ""
#   api_key: ""            # prefer JMDN_ALERTS_API_KEY
#   chat_id: ""            # prefer JMDN_ALERTS_CHAT_ID
#   http_timeout: 10s
